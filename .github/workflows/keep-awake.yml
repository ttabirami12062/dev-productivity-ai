name: Keep the backend awake

# Render's free plan puts the server to sleep after 15 minutes without visitors,
# and waking it takes about 50 seconds. Calling /health every 10 minutes keeps it
# awake, so visitors get a report in seconds instead of waiting a minute.
# GitHub may run scheduled jobs a few minutes late; the 10-minute gap leaves room.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health check
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 https://dev-productivity-ai.onrender.com/health; then
              echo; echo "Backend is awake"; exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s"; sleep 20
          done
          echo "Backend did not answer after 3 attempts"; exit 1
