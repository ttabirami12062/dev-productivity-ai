name: Nightly snapshots

# Saves each tracked repository's numbers once a day so the dashboard can show
# trends over months. No OpenAI calls, so it's free; it also keeps the free
# Supabase project from pausing after a week without activity.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC every day
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save today's snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # The workflow's own token can read public repositories through GitHub's API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.snapshots
