name: AI Quality Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Check the health score math
      run: python tests/test_metrics.py

    - name: Check the made-up number detector
      run: python tests/test_citation_check.py

    - name: Check team document uploads
      run: python tests/test_team_docs.py

    - name: Check month-over-month comparisons
      run: python tests/test_history.py

    - name: Check email building
      run: python tests/test_emails.py

    # Calls the real model, so it only runs when the OpenAI key secret is set.
    - name: Check report quality against the golden dataset
      if: ${{ env.OPENAI_API_KEY != '' }}
      run: python tests/test_evaluation.py
